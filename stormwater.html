<style>
:root{color-scheme:light;--bg:#F2F3F1;--panel:#FFFFFF;--ink:#17251F;--muted:#5E6E66;--line:#D9DDD8;--petrol:#1F5A5C;--bronze:#8E6A3E;--track:#DDE2DE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101716;--panel:#1B2421;--ink:#EDF4F0;--muted:#A9BAB1;--line:#2C3833;--petrol:#5FB3AE;--bronze:#C99B62;--track:#2C3833}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101716;--panel:#1B2421;--ink:#EDF4F0;--muted:#A9BAB1;--line:#2C3833;--petrol:#5FB3AE;--bronze:#C99B62;--track:#2C3833}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 22px}
.viewer{position:relative;height:min(66vh,600px);min-height:420px;border-radius:22px;overflow:hidden;background:linear-gradient(#F4F5F3,#E6E9E6);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .viewer{background:linear-gradient(#1B2321,#141A19)}}
:root[data-theme="dark"] .viewer{background:linear-gradient(#1B2321,#141A19)}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none}
.permit{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.9);color:#17251F;border-radius:999px;padding:6px 11px 6px 9px;font-size:.74rem}
.permit i{width:7px;height:7px;border-radius:50%;background:#8E6A3E;display:block}
.step{position:absolute;left:12px;top:12px;max-width:min(62%,420px);background:rgba(255,255,255,.92);color:#17251F;border-radius:14px;padding:8px 12px}
.step small{display:block;font-size:.72rem;color:#5E6E66;font-variant-numeric:tabular-nums}
.step b{display:block;font-size:.98rem;font-weight:600;line-height:1.25;margin-top:1px}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pins svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pins line{stroke:rgba(23,37,31,.78);stroke-width:1.2}
.pins circle{fill:#fff;stroke:#17251F;stroke-width:2}
.pin{position:absolute;left:0;top:0;background:rgba(23,37,31,.92);color:#fff;font-size:.74rem;line-height:1.25;padding:5px 9px;border-radius:9px;max-width:170px;font-weight:500;opacity:0;transition:opacity .45s;will-change:transform}
.pin.on{opacity:1}
.bar{display:flex;align-items:center;gap:12px;margin-top:12px}
.bar button{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.05rem;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.bar button.play{width:50px;height:50px;background:var(--petrol);border-color:var(--petrol);color:#fff}
.bar button:focus-visible,.seg button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.seg{flex:1;display:flex;gap:3px;align-items:center;min-width:0}
.seg button{flex:1;height:22px;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;border-radius:0;width:auto}
.seg button i{display:block;width:100%;height:5px;border-radius:3px;background:var(--track);overflow:hidden;position:relative}
.seg button i b{position:absolute;inset:0;width:0;background:var(--petrol);display:block}
.cap{margin:12px 2px 0;max-width:72ch}
.cap p{margin:0;font-size:.92rem;line-height:1.55}
.cap .ref{margin-top:7px;font-size:.76rem;color:var(--muted)}
.cap .ref b{font-weight:500;color:#8A3B17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cap .ref b{color:#E3A27E}}
.foot{color:var(--muted);font-size:.74rem;line-height:1.45;margin:14px 2px 0;max-width:80ch}
details{margin:8px 2px 0}details summary{cursor:pointer;font-size:.8rem;color:var(--muted)}
details ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:.76rem;line-height:1.5}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#5E6E66;font-size:.85rem}
@media (max-width:560px){.viewer{height:460px;min-height:0}.step{max-width:calc(100% - 24px);top:auto;bottom:12px}.pin{font-size:.66rem;max-width:104px;padding:4px 7px}}
@media (min-width:980px){
 .wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);column-gap:24px;align-items:start;max-width:1440px}
 .viewer{grid-column:1;grid-row:1 / span 5;height:min(76vh,720px)}
 .bar,.cap,.foot,details{grid-column:2}
 .bar{margin-top:0;flex-wrap:wrap}
 .seg{flex-basis:100%;order:3}
 .cap{margin-top:16px}
}
.vtabs{display:flex;gap:2px;background:var(--track);border-radius:12px;padding:3px;margin:0 0 10px;width:max-content;max-width:100%}
.vtabs button{border:0;background:transparent;color:var(--ink);font:500 .88rem/1 inherit;font-family:inherit;padding:9px 16px;border-radius:9px;cursor:pointer;min-height:40px}
.vtabs button[aria-pressed="true"]{background:var(--panel);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.plans[hidden],.vtabs [hidden]{display:none!important}
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.plist{display:flex;flex-direction:column;gap:8px}.pgroup b{display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.pchips{display:flex;flex-wrap:wrap;gap:6px}.pchips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 .78rem/1.2 inherit;font-family:inherit;cursor:pointer;min-height:34px}
.pchips button[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.pframe{position:relative;border:1px solid var(--line);border-radius:18px;overflow:auto;background:#fff;height:min(68vh,620px)}
.pframe img{display:block;width:100%;height:auto;transform-origin:0 0}
.ptools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ptools button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem;cursor:pointer}
.ptools .pcap{font-size:.82rem;color:var(--ink);margin-left:6px}.ptools .pcap small{display:block;color:var(--muted);font-size:.72rem}
.reflink{border:0;background:none;color:var(--petrol);font:inherit;font-size:.76rem;text-decoration:underline;cursor:pointer;padding:0;margin-left:4px}
@media (min-width:980px){.plans{grid-template-columns:260px minmax(0,1fr)}.plans .pmain{grid-column:2}.plans .plist{grid-row:1 / span 2}}

 const top=mob?54:70,bottom=h-(mob?84:14),gap=6;
 const it=pinEls.map(x=>{let a;if(x.bot){if(!camBot.visible)return {x,ok:false};const wp=new THREE.Vector3();camBot.getWorldPosition(wp);a=proj(wp);}else a=proj(x.p);return {x,ok:a.ok,ax:a.x,ay:a.y,lw:x.d.offsetWidth,lh:x.d.offsetHeight};});
 // object bounds on screen: step box (if any) + anchors
 let x0=1e9,x1=-1e9;(STEPS[si].box||[]).forEach(b=>{const q=proj(V(b));x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);});
 it.forEach(o=>{if(o.ok){x0=Math.min(x0,o.ax);x1=Math.max(x1,o.ax);}});const cx=(x0+x1)/2;
 const oneCol=mob&&STEPS[si].box;const L=it.filter(o=>o.ok&&(oneCol||o.ax<cx)).sort((a,b)=>a.ay-b.ay),R=it.filter(o=>o.ok&&!oneCol&&o.ax>=cx).sort((a,b)=>a.ay-b.ay);
 function stack(col){let y=top;col.forEach(o=>{o.ty=Math.max(o.ay-o.lh/2,y);y=o.ty+o.lh+gap;});let maxB=bottom;for(let i=col.length-1;i>=0;i--){const o=col[i];if(o.ty+o.lh>maxB)o.ty=maxB-o.lh;maxB=o.ty-gap;}col.forEach(o=>o.ty=Math.max(top,o.ty));}
 stack(L);stack(R);
 L.forEach(o=>{o.tx=oneCol?10:Math.max(8,Math.min(x0-30-o.lw,o.ax-16-o.lw));o.side='L';});
 R.forEach(o=>{o.tx=Math.min(w-8-o.lw,Math.max(x1+30,o.ax+16));o.side='R';});
 it.forEach(o=>{const x=o.x;if(!o.ok){x.d.style.visibility='hidden';x.ln.style.visibility=x.dot.style.visibility='hidden';return;}
  x.d.style.visibility='';x.ln.style.visibility=x.dot.style.visibility='';
  if(x.x==null){x.x=o.tx;x.y=o.ty;}else{const kq=1-Math.pow(.0005,pinDt);x.x=lerp(x.x,o.tx,kq);x.y=lerp(x.y,o.ty,kq);}
  x.d.style.transform='translate('+x.x.toFixed(1)+'px,'+x.y.toFixed(1)+'px)';
  const ex=o.side==='L'?x.x+o.lw:x.x,ey=x.y+o.lh/2;
  x.ln.setAttribute('x1',ex);x.ln.setAttribute('y1',ey);x.ln.setAttribute('x2',o.ax);x.ln.setAttribute('y2',o.ay);x.dot.setAttribute('cx',o.ax);x.dot.setAttribute('cy',o.ay);});}

$('seg').innerHTML=STEPS.map((s,i)=>'<button data-i="'+i+'" aria-label=""><i><b></b></i></button>').join('');

function go(i){si=clamp(i,0,NS-1);st=0;userCam=false;camFrom={p:cam.position.clone(),t:controls.target.clone()};camFromS=null;text();buildPins();}

const SHEETS=[{g:L('Building · RJM 2502-009 (structure and phasing)','Edificio · RJM 2502-009 (estructura y fases)'),items:[['COVER',L('Scope, codes and repair notes','Alcance, códigos y notas')],['CP-100',L('Construction phasing plan I–III','Plan de fases de construcción I–III')],['BID-100',L('Bid notes and budget table','Notas de oferta y tabla de presupuesto')]]},
 {g:L('Storm plumbing · RJM 25-009','Plomería pluvial · RJM 25-009'),items:[['P-000',L('General notes and scope','Notas generales y alcance')],['P-001.1',L('CIPP lining specification','Especificación CIPP')],['P-001D',L('Underground: demolition and relining','Subterráneo: demolición y relining')],['P-001',L('Underground: proposed plan','Subterráneo: planta propuesta')],['P-100D',L('Above ground: demolition','Aérea: demolición')],['P-100',L('Above ground: new piping','Aérea: tubería nueva')],['P-100.1',L('Drains and hangers','Drenajes y colgadores')],['P-101',L('Lobby level and pool deck','Nivel lobby y pool deck')],['P-102',L('Pump station detail','Estación de bombeo: detalle')],['P-200',L('Pump specifications','Especificaciones de bombas')],['P-300',L('Existing condition photos','Fotos de condición existente')],['P-400',L('Isometric cast iron → PVC','Isométrico hierro fundido → PVC')]]}];
const SHEET_IDS=SHEETS.flatMap(g=>g.items.map(x=>x[0]));let curSheet='CP-100',pz=1;
function sheetSrc(id){try{if(parent&&parent!==window&&parent.__SHEETS&&parent.__SHEETS[id])return parent.__SHEETS[id];}catch(e){}if(window.__SHEETS&&window.__SHEETS[id])return window.__SHEETS[id];return './assets/sheets/'+id+'.jpg';}
function plansRender(){const pl=$('plist');pl.innerHTML=SHEETS.map(g=>'<div class="pgroup"><b>'+tr(g.g)+'</b><div class="pchips">'+g.items.map(([id,t])=>'<button type="button" data-sheet="'+id+'" aria-pressed="'+(id===curSheet)+'">'+id+'</button>').join('')+'</div></div>').join('');
 pl.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));const it=SHEETS.flatMap(g=>g.items).find(x=>x[0]===curSheet);
 $('pcap').innerHTML='<b>'+curSheet+'</b> · '+tr(it[1])+'<small>'+(curSheet.startsWith('P-')?'RJM Consultants · 25-009 · R. J. Miranda P.E. 35579 · '+tr(L('signed 12/2/2025','firmado 2/12/2025')):'RJM Consultants · 2502-009 · '+'rev. 9/24/2025')+'</small>';
 const img=$('pimg');const src=sheetSrc(curSheet);if(img.getAttribute('src')!==src){img.src=src;img.alt=curSheet;}img.style.width=(pz*100)+'%';}
function openSheet(id){curSheet=id;pz=1;setTab('plans');plansRender();$('pframe').scrollTo(0,0);}
function setTab(t){const pl=t==='plans';$('plans').hidden=!pl;$('viewer').hidden=pl;document.querySelector('.bar').hidden=pl;document.querySelector('.cap').hidden=pl;
 document.querySelectorAll('[data-vt]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.vt===t)));if(pl){setPlaying(false);plansRender();}else{resize();}postH();}
document.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>setTab(b.dataset.vt));
$('pzIn').onclick=()=>{pz=Math.min(4,pz*1.5);plansRender();};$('pzOut').onclick=()=>{pz=Math.max(1,pz/1.5);plansRender();};$('pzFit').onclick=()=>{pz=1;plansRender();};
function refSheet(ref){const ids=(ref||'').match(/(CP-100|BID-100|P-\d{3}(?:\.\d|D)?)/g)||[];return ids.find(x=>SHEET_IDS.includes(x))||null;}
function text(){const s=STEPS[si];$('sNum').textContent=tr(UI.step)+' '+(si+1)+' '+tr(UI.of)+' '+NS;$('sTitle').textContent=tr(s.t);$('sText').textContent=tr(s.x);
 $('sRef').innerHTML=tr(UI.sheets)+': '+s.ref+(s.run&&s.run!=='temp'?' · <b>'+tr(UI.gate)+'</b>':'')+(s.gate==='classv'?' · <b>'+(LANG==='es'?'Requiere permiso Class V de DERM: no solicitado; aprobación de la Junta pendiente.':'Requires a DERM Class V permit: not applied for; Board approval pending.')+'</b>':'');
 {const rs=refSheet(s.ref);if(rs){const bt=document.createElement('button');bt.type='button';bt.className='reflink';bt.textContent=tr(L('See sheet ','Ver plano '))+rs;bt.onclick=()=>openSheet(rs);$('sRef').appendChild(bt);}}
 segBtns.forEach((b,k)=>b.setAttribute('aria-label',tr(UI.step)+' '+(k+1)+': '+tr(STEPS[k].t)));}
function setPlaying(v){playing=v;$('bPlay').textContent=v?'❚❚':'▶';$('bPlay').setAttribute('aria-label',tr(v?UI.pause:UI.play));}
$('bPlay').addEventListener('click',()=>{if(!playing&&si===NS-1&&st>=STEPS[si].d)go(0);setPlaying(!playing);if(playing)userCam=false;});
$('bNext').addEventListener('click',()=>go(si+1));$('bBack').addEventListener('click',()=>go(st>1.5?si:si-1));
function applyLang(){document.documentElement.lang=LANG;$('vtTour').textContent=tr(L('3D tour','Recorrido 3D'));$('vtPlans').textContent=tr(L('Plans','Planos'));if(!$('plans').hidden)plansRender();$('permit').textContent=tr(UI.permit);$('foot').textContent=tr(UI.foot);$('srcT').textContent=tr(UI.src);$('srcList').innerHTML=SRC[LANG].map(s=>'<li>'+s+'</li>').join('');text();buildPins();setPlaying(playing);}
let visible=true;
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='collins-language'&&(d.lang==='es'||d.lang==='en')&&d.lang!==LANG){LANG=d.lang;applyLang();}if(d.type==='collins-visibility'){visible=!!d.visible;if(!visible)setPlaying(false);}});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);resize();
let last=0,viewOff=0;
function loop(now){requestAnimationFrame(loop);if(!visible||document.hidden){last=now;return;}const dt=Math.min(.1,(now-(last||now))/1000);last=now;
 if(playing){st+=dt*SPEED;if(st>=STEPS[si].d){if(si<NS-1){go(si+1);}else{st=STEPS[si].d;setPlaying(false);}}}
 segBtns.forEach((b,k)=>{b.querySelector('b').style.width=(k<si?100:k>si?0:Math.min(100,st/STEPS[si].d*100))+'%';});
 {const w=host.clientWidth,h=host.clientHeight;const want=(w<560&&STEPS[si].box)?-w*.2:0;viewOff=lerp(viewOff,want,1-Math.pow(.01,dt));if(Math.abs(viewOff)>.5)cam.setViewOffset(w,h,viewOff,0,w,h);else if(cam.view&&cam.view.enabled)cam.clearViewOffset();}
 applyVis(dt);camDrive();apply(now,dt);controls.update();renderer.render(scene,cam);placePins(dt);}
window.__tour={steps:()=>STEPS.map(s=>({id:s.id,ph:s.ph,d:s.d})),go,setPlaying,get si(){return si},set st(v){st=v},cam,controls};
applyLang();go(0);camFrom=null;$('load').remove();
function postH(){try{parent.postMessage({type:'collins-storm-height',height:Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+8},'*');}catch(e){}}
new ResizeObserver(postH).observe(document.querySelector('.wrap'));postH();
requestAnimationFrame(loop);
})();
