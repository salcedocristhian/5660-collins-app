<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#modelMount{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#f8faf7,#e8eee9)}#interiorCanvas{display:block;width:100%;height:100%;touch-action:pan-y}#floorStatus{position:absolute;bottom:13px;left:14px;right:14px;background:#ffffffdc;border:1px solid #e2ebe5;border-radius:12px;padding:9px 12px;color:#355645;font-size:12px;line-height:1.35;pointer-events:none}#floorSelect,#weekRange{position:absolute;opacity:0;pointer-events:none}.hint{position:absolute;top:14px;right:14px;border-radius:999px;padding:7px 11px;background:#ffffffdc;color:#547060;font-size:11px}.legend{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:7px;font-size:11px;color:#6d8575}.legend i{width:8px;height:8px;border-radius:50%;background:#c8a364}</style></head><body><div id="modelMount" data-mode="interior"><canvas id="interiorCanvas" aria-label="Interactive conceptual corridor sequence visualization"></canvas><div class="legend"><i></i>Conceptual sequence model</div><div class="hint">Drag to rotate · Pinch to zoom</div><select id="floorSelect"></select><input id="weekRange" type="range" min="0" max="34" value="0"><div id="floorStatus">Planning sequence · Week 0 of 34</div></div><script>
(()=>{'use strict';const root=document.getElementById('modelMount'),canvas=document.getElementById('interiorCanvas'),ctx=canvas.getContext('2d'),floorSel=document.getElementById('floorSelect'),week=document.getElementById('weekRange'),status=document.getElementById('floorStatus');for(let n=2;n<=21;n++){let o=document.createElement('option');o.value=String(n);o.textContent='Floor '+n;floorSel.appendChild(o)}let ph=document.createElement('option');ph.value='PH';ph.textContent='Penthouse';floorSel.appendChild(ph);let mode='interior',angle=-.36,zoom=1,drag=false,lastX=0,dirty=true;function resize(){const d=Math.min(2,devicePixelRatio||1),w=root.clientWidth,h=root.clientHeight;canvas.width=Math.max(1,Math.round(w*d));canvas.height=Math.max(1,Math.round(h*d));ctx.setTransform(d,0,0,d,0,0);dirty=true;draw()}function poly(points,fill,stroke='#b8c9bd',line=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}function line(a,b,color='#9cb4a7',width=1){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function label(t,x,y,size=11,color='#426a55'){ctx.fillStyle=color;ctx.font='600 '+size+'px -apple-system, sans-serif';ctx.fillText(t,x,y)}function draw(){const w=root.clientWidth,h=root.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);ctx.fillStyle='#f3f7f3';ctx.fillRect(0,0,w,h);const cx=w*.5,cy=h*.51,scale=Math.min(w/450,h/360)*zoom;ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);if(mode==='exterior'){for(let i=0;i<21;i++){let y=120-i*11,offset=i*.6;poly([[-105+offset,y],[-25+offset,y-23],[98+offset,y],[19+offset,y+25]],i%2?'#f5f8f6':'#e9f1ec','#bacdc0');poly([[-105+offset,y],[-105+offset,y-9],[-25+offset,y-32],[-25+offset,y-23]],'#d8e7dc');poly([[-25+offset,y-23],[-25+offset,y-32],[98+offset,y-9],[98+offset,y]],'#d5e6dc');if(i%3===0)line([-85+offset,y-3],[0+offset,y+13],'#9db7a6',1.5)}label('BUILDING · CONCEPTUAL MASSING',-105,153,10)}else{const c=Math.cos(angle),s=Math.sin(angle);function pt(x,y,z=0){return [x*c-y*s, x*s*.40+y*c*.40-z]}const elevation=22;const arms=[[-170,100],[170,100],[0,-185]];const activity=Number(week.value);for(let k=0;k<3;k++){const [ax,ay]=arms[k],p0=pt(0,0),p1=pt(ax,ay),wide=17;let dx=ax/Math.hypot(ax,ay),dy=ay/Math.hypot(ax,ay),nx=-dy*wide,ny=dx*wide;let a=pt(nx,ny),b=pt(ax+nx,ay+ny),c1=pt(ax-nx,ay-ny),d=pt(-nx,-ny);poly([a,b,c1,d],activity>0?'#e1eee7':'#e7ece7','#8eb4a5',2);for(let j=1;j<7;j++){const t=j/7,x=ax*t,y=ay*t;let l=pt(x+nx,y+ny),r=pt(x-nx,y-ny);line(l,r,'#afc9b8',.7);let wall1=pt(x+nx,y+ny,elevation),wall2=pt(x-nx,y-ny,elevation);line(l,wall1,'#aac0b1',1.2);line(r,wall2,'#aac0b1',1.2);if(j%2===0){line(wall1,pt(x+nx+dx*10,y+ny+dy*10,elevation),'#bfd3c4',1);line(wall2,pt(x-nx+dx*10,y-ny+dy*10,elevation),'#bfd3c4',1)}}const wallA=pt(nx,ny,elevation),wallB=pt(ax+nx,ay+ny,elevation),wallC=pt(ax-nx,ay-ny,elevation),wallD=pt(-nx,-ny,elevation);line(wallA,wallB,'#96b5a2',2);line(wallC,wallD,'#96b5a2',2);if(activity>0){const progress=Math.min(1,activity/34),q=pt(ax*progress,ay*progress);ctx.beginPath();ctx.arc(q[0],q[1]-2,5,0,Math.PI*2);ctx.fillStyle='#398d70';ctx.fill()}}poly([pt(-28,-28),pt(28,-28),pt(28,28),pt(-28,28)],'#c5dfd1','#73a88e',1.5);label('CORRIDOR · SCHEMATIC',-88,145,10)}ctx.restore();dirty=false}function update(){status.textContent=(mode==='exterior'?'Building overview':'Floor '+(floorSel.value||'19')+' · Corridor sequence')+' · Planning week '+week.value+' / 34 · Conceptual, not verified completion';draw()}floorSel.value='19';floorSel.addEventListener('change',update);week.addEventListener('input',update);canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)*.006;lastX=e.clientX;draw()}});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(2,zoom-e.deltaY*.001));draw()},{passive:false});let lastDist=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lastDist)zoom=Math.max(.65,Math.min(2,zoom*d/lastDist));lastDist=d;draw()}},{passive:true});canvas.addEventListener('touchend',()=>lastDist=0);window.CorridorInterior={get mode(){return mode},showMode(v){mode=v==='exterior'?'exterior':'interior';root.dataset.mode=mode;update()},setFloor(v){floorSel.value=v;update()},setWeek(v){week.value=v;update()}};new ResizeObserver(resize).observe(root);window.addEventListener('resize',resize);resize();update()})();
</script></body></html>
