name: Patch Floor 2 Thursday carpet film
on:
  push:
    branches: [main, 'fix/pilot-carpet-thursday-20261107']
    paths:
      - 'scripts/patch_floor2_pilot_thursday.py'
      - '.github/workflows/patch-floor2-thursday.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: floor2-thursday-film
  cancel-in-progress: false
jobs:
  regression-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run source-preserving reconstruction patch + JavaScript syntax + pacing tests
        run: python3 scripts/patch_floor2_pilot_thursday.py --check
      - name: Validate existing resident content and event statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          n=json.loads(Path('data/notices.json').read_text())
          s=json.loads(Path('data/public-schedule-2026-10-28.json').read_text())
          k=json.loads(Path('data/public-kb-2026-10-28.json').read_text())
          message=next(x for x in n['notices'] if x['id']=='floor2-carpet-access-planning-2026-11-06')['message']['en']
          assert 'Thursday, November 12' in message
          assert 'tentative' in message.lower()
          carpet=[x for x in s['milestones'] if 'carpet' in x['title']['en'].lower()]
          assert len(carpet)==1 and carpet[0]['date']=='2026-11-12'
          assert 'Thursday, November 12' in next(x for x in k['faqs'] if 'carpet' in x['question']['en'].lower())['answer']['en']
          print('PASS: resident Updates / Schedule / FAQ share the tentative Thursday date.')
          PY
  publish-film:
    needs: regression-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply carefully scoped existing-film patch
        run: python3 scripts/patch_floor2_pilot_thursday.py
      - name: Verify resulting file and publish change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "reconstruction.html"
          git diff --check
          grep -q 'PILOT_THURSDAY_SHIFT_PACING_20261107' reconstruction.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction.html
          git commit -m 'fix: animate carpet removal on tentative Thursday and preserve 50% shift progress'
          git push origin HEAD:main
      - name: Request GitHub Pages build for workflow-authored change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages-rebuild.json -w '%{http_code}' \
            -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" || true)
          if [[ "$status" != "201" && "$status" != "202" && "$status" != "204" ]]; then
            echo "::warning::GitHub Pages rebuild not confirmed (HTTP $status)"
            cat /tmp/pages-rebuild.json || true
          fi
