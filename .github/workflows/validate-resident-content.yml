name: Validate resident updates and schedule
on:
  push:
    branches: [main, 'updates/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and resident content consistency
        shell: bash
        run: |
          set -euo pipefail
          find assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check sw.js
          python3 - <<'PY'
          import json, re, subprocess, tempfile
          from pathlib import Path
          data = Path('data')
          for f in data.glob('*.json'):
              json.loads(f.read_text(encoding='utf-8'))
          notices = json.loads((data/'notices.json').read_text(encoding='utf-8'))
          kb = json.loads((data/'public-kb-2026-10-28.json').read_text(encoding='utf-8'))
          schedule = json.loads((data/'public-schedule-2026-10-28.json').read_text(encoding='utf-8'))
          permits = json.loads((data/'permits.json').read_text(encoding='utf-8'))
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/resident-ios.js').read_text(encoding='utf-8')
          corridor = next(x for x in permits['items'] if x['number']=='BC2628687')
          assert corridor['group']=='issued' and 'November 6' in corridor['status']
          # Nov 13 verified Side A containment supersedes previous planning-only statements.
          kb_corridor = next(x for x in kb['projects'] if x['id']=='corridor')
          assert kb_corridor['permit']=='BC2628687'
          assert 'November 6' in kb_corridor['summary']['en']
          assert 'Floor 2' in kb_corridor['summary']['en'] and 'Floor 3' in kb_corridor['summary']['en']
          assert 'partial' in kb_corridor['summary']['en']
          latest = notices['notices'][0]
          assert latest['date']=='2026-11-13'
          assert latest['id']=='corridor-containment-sidea-field-2026-11-13'
          assert 'Floor 2, Side A' in latest['message']['en']
          assert 'Floor 3, Side A' in latest['message']['en']
          assert 'not yet fully complete' in latest['message']['en']
          assert kb['asOf']=='2026-11-13'
          assert any(x['id']=='firewatch-weekend-2026-11-13' and 'November 14' in x['message']['en'] for x in notices['notices'])
          assert any(x['id']=='corridor-carpet-rmd-followup-2026-11-13' and 'November 16' in x['message']['en'] for x in notices['notices'])
          assert any(x.get('group')=='pilot' for x in schedule['timeline'])
          assert any(x.get('group')=='issued' and 'Hallway' in x['name']['en'] for x in schedule['timeline'])
          assert all(x['title'].get('en') and x['title'].get('es') for x in schedule['milestones'])
          assert schedule['milestones']==sorted(schedule['milestones'],key=lambda x:x['date'])
          # Historical November 12 schedule milestone is superseded; new dates are not invented.
          carpet = [x for x in schedule['milestones'] if 'carpet' in x['title']['en'].lower()]
          assert len(carpet)==1 and carpet[0]['date']=='2026-11-12'
          floor2_carpet = next(x for x in notices['notices'] if x['id']=='floor2-carpet-access-planning-2026-11-06')
          assert 'supersedes' in floor2_carpet['message']['en']
          assert 'November 16' in next(x for x in kb['faqs'] if 'carpet' in x['question']['en'].lower())['answer']['en']
          assert not any(x['projectId']=='corridor' and 'not issued' in x['message']['en'].lower() for x in notices['notices'])
          assert 'City permit BC2628687 remains pending' not in html
          assert 'const projectDefs=[' in html and 'residentFloorNotice' in html
          assert 'collins-language-changed' in html and 'collins-language-changed' in js
          assert '20261113-sidea-containment-firewatch-v13' in html and '20261113-sidea-containment-firewatch-v13' in Path('sw.js').read_text()
          embedded = re.search(r'<script type="application/json" id="residentKBBackup">(.*?)</script>',html,re.S)
          assert embedded is not None
          assert json.loads(embedded.group(1))==kb
          scripts = 0
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',html,re.S|re.I):
              attrs, source = m.group(1), m.group(2)
              if 'application/json' in attrs or not source.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as tmp:
                  tmp.write(source)
              try:
                  subprocess.run(['node','--check',tmp.name],check=True)
              finally:
                  Path(tmp.name).unlink(missing_ok=True)
              scripts += 1
          assert scripts >= 5
          print(f'PASS: 5660 resident content; {scripts} inline scripts parsed, bilingual milestones and issued permit consistent.')
          PY
          git diff --check
